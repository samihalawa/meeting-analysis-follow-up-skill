interface:
  display_name: "Meeting Analysis & Follow-Up"
  short_description: "Analyze any meeting and draft an impression-aware follow-up"
  default_prompt: "Use $meeting-analysis-follow-up-skill to fully read one meeting transcript plus any supplied context files, extract evidenced statements, pain points, commitments, risks, and the impression given, then produce a 1–3 page HTML-to-PDF debrief and one unsent follow-up email draft that improves that impression. Work for any person and any meeting kind. Do not require a specific recorder, CRM, or interview template."
